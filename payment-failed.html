  <body>
    <header class="header">
      <nav class="container nav" aria-label="Main navigation">
        <a class="brand" href="index.html"
          ><img src="logo.png" alt="BTE Global" /><span
            >Benchmark Technology<br />Engineering L.L.C-FZ</span
          ></a
        >
        <div class="nav-tools">
          <a class="back" href="index.html" data-i18n="home">Back to home</a>
          <div class="languages" aria-label="Language">
            <button type="button" data-lang="en" aria-label="English">EN</button
            ><button type="button" data-lang="ru" aria-label="Русский">
              RU</button
            ><button type="button" data-lang="ar" aria-label="العربية">
              AR
            </button>
          </div>
          <button
            class="theme"
            type="button"
            data-theme-toggle
            aria-label="Switch color theme"
          >
            <svg aria-hidden="true">
              <use href="assets/icons.svg#sun"></use>
            </svg>
          </button>
        </div>
      </nav>
    </header>
    <main class="container">
      <div class="result">
        <p class="eyebrow">BTE GLOBAL · CONSULTATIONS</p>
        <h1 data-i18n="failureTitle"></h1>
        <p class="muted" data-i18n="resultNote"></p>
        <div class="result-card">
          <div id="payment-notice" class="notice"></div>
          <p>
            <span data-i18n="bookingId"></span>: <span id="booking-id">—</span>
          </p>
          <p>
            <span data-i18n="status"></span>:
            <strong id="booking-status">—</strong>
          </p>
          <p>
            <span data-i18n="paymentStatus"></span>:
            <strong id="payment-status">—</strong>
          </p>
          <p id="payment-total"></p>
          <p id="payment-error" class="error" role="alert"></p>
          <button
            id="mock-pay"
            class="primary"
            type="button"
            data-i18n="mockPay"
            hidden
          ></button
          ><button
            id="refresh"
            class="primary"
            type="button"
            data-i18n="refresh"
          ></button>
          <p><a href="book-consultation.html" data-i18n="retry"></a></p>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <span
          >© 2026 BTE Global ·
          <span data-i18n="footer"
            >Engineering software. Solving business challenges.</span
          ></span
        ><a href="mailto:projects@bteglobal.ae">projects@bteglobal.ae</a>
      </div>
    </footer>
